<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen Ty</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div class="card">

    <!-- Header with user + logo -->
    <div class="header">
      <div class="info">
        <div class="user-wrap">
          <img src="user.png" alt="User" class="user">
        </div>
        <h2>Karen Ty</h2>
        <p class="title">Makeup Artist • KT Makeup Artistry</p>
        <a href="https://maps.app.goo.gl/oG8TfX1XMANeFiui6" class="location" target="_blank">
          <i class="ri-map-2-line"></i> Quezon City, Metro Manila
        </a>
      </div>
      <div class="divider"></div>
      <div class="logo-wrap">
        <img src="logo.png" alt="Logo" class="logo">
      </div>
    </div>

    <!-- Bio -->
    <p class="bio">
    </p>

    <!-- Buttons -->
    <div class="button-grid">
  <a href="tel:+639228912898" class="btn call"><i class="ri-phone-fill"></i></i> Call</a>
  <a href="mailto:#" class="btn email"><i class="ri-mail-send-line"></i> Email</a>
  <a href="https://m.facebook.com/itsktmakeupartistry" target="_blank" class="btn website"><i class="ri-global-line"></i> Website</a>
  <a href="user.vcf" class="btn save"><i class="ri-download-line"></i> Save Contact</a>
  <a href="#" class="btn share" onclick="shareCard(event)"><i class="ri-share-forward-fill"></i> Share Card</a>
  <script>
    function shareCard(e) {
      e.preventDefault();
      if (navigator.share) {
        navigator.share({
          title: 'Kren Ty',
          text: 'Check out my contact card!',
          url: window.location.href
        });
      } else {
        alert('Sharing is not supported on this device.');
      }
    }
  </script>
</div>

    <!-- Social icons -->
    <div class="socials">
      <a href="https://m.facebook.com/itsktmakeupartistry" target="_blank"><i class="ri-facebook-circle-line"></i></a>
      <a href="https://m.instagram.com/ktmakeup_artistry" target="_blank"><i class="ri-instagram-line"></i></a>
      <a href="#" target="_blank"><i class="ri-linkedin-box-line"></i></a>
      <a href="#" target="_blank"><i class="ri-telegram-2-line"></i></a>
    </div>

    <!-- Footer -->
    <p class="footer">Tap or scan to connect • © 2025 KT Makeup Artistry</p>
  </div>
</body>
</html>
